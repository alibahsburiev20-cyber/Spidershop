<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Вход — Spidershop</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <nav class="nav">
    <div class="nav__inner">
      <a href="/" class="nav__logo">Spider<span>shop</span></a>
      <div class="nav__links">
        <a href="/register.html">Регистрация</a>
      </div>
    </div>
  </nav>

  <div class="container container--narrow">
    <div class="card">
      <h2 class="card__title">Вход</h2>
      <div id="alert" class="hidden"></div>
      <form id="form">
        <div class="form-row">
          <label>Email</label>
          <input id="email" type="email" required autocomplete="email">
        </div>
        <div class="form-row">
          <label>Пароль</label>
          <input id="password" type="password" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn btn--primary btn--block btn--lg" id="submit">Войти</button>
      </form>
      <p class="muted center mt-2">Нет аккаунта? <a href="/register.html">Создать</a></p>
    </div>
  </div>

  <script type="module">
    import { signIn, isLoggedIn } from '/js/supabase.js';

    if (isLoggedIn()) location.href = '/dashboard.html';

    const form = document.getElementById('form');
    const alertBox = document.getElementById('alert');
    const btn = document.getElementById('submit');

    function showAlert(msg, type = 'error') {
      alertBox.className = `alert alert--${type}`;
      alertBox.textContent = msg;
      alertBox.classList.remove('hidden');
    }

    form.addEventListener('submit', async e => {
      e.preventDefault();
      alertBox.classList.add('hidden');
      btn.disabled = true;
      btn.textContent = 'Входим…';
      try {
        await signIn(
          document.getElementById('email').value.trim(),
          document.getElementById('password').value
        );
        location.href = '/dashboard.html';
      } catch (err) {
        showAlert(err.message);
        btn.disabled = false;
        btn.textContent = 'Войти';
      }
    });
  </script>
</body>
</html>
