<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Новый товар — Spidershop</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <nav class="nav">
    <div class="nav__inner">
      <a href="/" class="nav__logo">Spider<span>shop</span></a>
      <div class="nav__links">
        <a href="/dashboard.html">← Кабинет</a>
      </div>
    </div>
  </nav>

  <div class="container container--narrow">
    <div class="card">
      <h2 class="card__title">Новый товар</h2>
      <div id="alert" class="hidden"></div>
      <form id="form">
        <div class="form-row">
          <label>Название</label>
          <input id="title" type="text" required maxlength="100">
        </div>
        <div class="form-row">
          <label>Описание</label>
          <textarea id="description" maxlength="3000"></textarea>
        </div>
        <div class="form-row">
          <label>Цена в USD</label>
          <input id="price" type="number" step="0.01" min="0" value="5.00" required>
          <div class="hint">Покупатель платит TON по курсу на момент оплаты. Поставь 0 для «бесплатно».</div>
        </div>
        <div class="form-row">
          <label>Обложка (JPG / PNG)</label>
          <input id="cover" type="file" accept="image/*">
        </div>
        <div class="form-row">
          <label>Файл товара</label>
          <input id="file" type="file" required>
          <div class="hint">Любой формат. Покупатель получит одноразовую ссылку.</div>
        </div>
        <div id="progress" class="hint hidden"></div>
        <button type="submit" class="btn btn--primary btn--block btn--lg" id="submit">Опубликовать</button>
      </form>
    </div>
  </div>

  <script type="module" src="/js/new-product.js"></script>
</body>
</html>
